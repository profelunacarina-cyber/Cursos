<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Módulo EPJA</title>
  <link rel="icon" href="../favicon.png" />
  <link rel="stylesheet" href="../tema.css" />
  <link rel="stylesheet" href="epja.css" />
</head>
<body class="epja-body">
  <div class="epja-shell">
    <aside class="epja-sidebar">
      <div class="epja-brand">
        <span class="badge">EPJA</span>
        <strong>Módulo</strong>
        <span>Lectura y seguimiento</span>
      </div>
      <button id="epja-menu-toggle" class="epja-menu-toggle" type="button" aria-controls="epja-nav" aria-expanded="false" aria-label="Abrir menu">
        <span class="menu-icon" aria-hidden="true"></span>
        <span class="sr-only">Abrir menu</span>
      </button>
      <nav id="epja-nav" class="epja-nav"></nav>
    </aside>

    <main class="epja-main">
      <div class="epja-topbar">
        <div>
          <div class="antetitulo" id="kicker">Módulo</div>
          <h1 class="titulo-bloque" id="titulo">Cargando…</h1>
        </div>
        <span id="estado" class="epja-pill warn">Pendiente</span>
      </div>

      <div class="epja-content">
        <section class="epja-panel">
          <p class="bajada" id="resumen"></p>
          <div id="contenido" class="epja-module-body" style="margin-top:18px;"></div>
        </section>
        <section id="autoevaluacion-panel" class="epja-panel" hidden>
          <div id="autoevaluacion"></div>
        </section>
        <section class="epja-panel">
          <div class="epja-actions" id="acciones"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../config.js"></script>
  <script src="api-epja.js"></script>
  <script>
    (function () {
      function salir() {
        EPJAApi.sesion.salir();
      }
      function mostrarError(error) {
        document.getElementById('titulo').textContent = 'No se pudo abrir el módulo';
        document.getElementById('resumen').textContent = error.message || 'No tenés acceso a este módulo.';
        document.getElementById('contenido').textContent = '';
        document.getElementById('acciones').textContent = '';
      }
      var id = Number(new URLSearchParams(location.search).get('id'));
      if (!id) {
        salir();
        return;
      }

      function pintar(modulo) {
        document.title = modulo.titulo + ' · EPJA';
        document.getElementById('kicker').textContent = modulo.materiaNombre;
        document.getElementById('titulo').textContent = modulo.titulo;
        document.getElementById('resumen').textContent = modulo.resumen || '';
        document.getElementById('contenido').innerHTML = modulo.contenido || '<p>Sin contenido.</p>';
        document.querySelectorAll('#contenido .ql-attachment[data-type^="image/"]').forEach(function (adjunto) {
          var ruta = adjunto.getAttribute('data-url');
          var visual = adjunto.querySelector('.attachment-visual');
          if (!ruta || !visual || visual.querySelector('img')) return;
          EPJAApi.alumno.descargarArchivo(ruta).then(function (archivo) {
            adjunto._archivoAdjunto = archivo;
            var urlPreview = URL.createObjectURL(archivo.contenido);
            adjunto._urlPreview = urlPreview;
            var imagen = document.createElement('img');
            imagen.src = urlPreview;
            imagen.alt = '';
            visual.textContent = '';
            visual.appendChild(imagen);
          }).catch(function () {
            // Si falla la miniatura, se conserva la tarjeta y su descarga normal.
          });
        });
        var estado = document.getElementById('estado');
        estado.className = 'epja-pill ' + (modulo.completado ? 'ok' : 'warn');
        estado.textContent = modulo.aprobado ? 'Aprobado' : (modulo.completado ? 'Completado' : 'Pendiente');

        pintarAutoevaluacion(modulo);

        var acciones = document.getElementById('acciones');
        acciones.textContent = '';
        if (!modulo.completado && !modulo.autoevaluacion.activa) {
          var completar = document.createElement('button');
          completar.className = 'epja-btn';
          completar.id = 'btn-completar';
          completar.type = 'button';
          completar.textContent = 'Marcar como completado ✓';
          acciones.appendChild(completar);
        }
        if (modulo.anterior) {
          var anterior = document.createElement('a');
          anterior.className = 'epja-btn-outline';
          anterior.style.textDecoration = 'none';
          anterior.href = 'modulo.html?id=' + encodeURIComponent(modulo.anterior.id);
          anterior.textContent = '← ' + modulo.anterior.titulo;
          acciones.appendChild(anterior);
        }
        if (modulo.siguiente) {
          var siguiente = document.createElement('a');
          siguiente.className = 'epja-btn-outline';
          siguiente.style.textDecoration = 'none';
          siguiente.href = 'modulo.html?id=' + encodeURIComponent(modulo.siguiente.id);
          siguiente.textContent = modulo.siguiente.titulo + ' →';
          acciones.appendChild(siguiente);
        }
        var volver = document.createElement('a');
        volver.className = 'epja-btn-outline';
        volver.style.textDecoration = 'none';
        volver.href = 'materia.html?codigo=' + encodeURIComponent(modulo.materiaCodigo);
        volver.textContent = 'Volver a la materia';
        acciones.appendChild(volver);

        var btn = document.getElementById('btn-completar');
        if (btn) {
          btn.addEventListener('click', function () {
            EPJAApi.alumno.completar(modulo.id).then(function () {
              location.reload();
            }).catch(function (err) {
              alert(err.message);
            });
          });
        }
      }

      function enlaceCertificado(moduloId) {
        var enlace = document.createElement('a');
        enlace.className = 'epja-btn';
        enlace.href = '/#certificado-epja?modulo=' + encodeURIComponent(moduloId);
        enlace.textContent = 'Descargar certificado';
        return enlace;
      }

      function pintarAutoevaluacion(modulo) {
        var panel = document.getElementById('autoevaluacion-panel');
        var contenedor = document.getElementById('autoevaluacion');
        contenedor.textContent = '';
        if (!modulo.autoevaluacion.activa) {
          panel.hidden = true;
          return;
        }
        panel.hidden = false;

        var cabecera = document.createElement('div');
        cabecera.className = 'epja-evaluation-head';
        var textos = document.createElement('div');
        var kicker = document.createElement('span');
        kicker.className = 'antetitulo';
        kicker.textContent = 'Actividad de cierre';
        var titulo = document.createElement('h2');
        titulo.textContent = 'Autoevaluación';
        var ayuda = document.createElement('p');
        ayuda.textContent = 'Respondé las 15 preguntas. Para aprobar necesitás 9 respuestas correctas (60 %).';
        textos.appendChild(kicker);
        textos.appendChild(titulo);
        textos.appendChild(ayuda);
        cabecera.appendChild(textos);
        var historial = document.createElement('span');
        historial.className = 'epja-pill';
        historial.textContent = modulo.autoevaluacion.intentos
          ? modulo.autoevaluacion.intentos + ' intento' + (modulo.autoevaluacion.intentos === 1 ? '' : 's') + ' · mejor ' + modulo.autoevaluacion.mejorPorcentaje + '%'
          : 'Sin intentos';
        cabecera.appendChild(historial);
        contenedor.appendChild(cabecera);

        if (modulo.aprobado) {
          var aprobado = document.createElement('div');
          aprobado.className = 'epja-result ok';
          var mensaje = document.createElement('strong');
          mensaje.textContent = 'Módulo aprobado';
          var detalle = document.createElement('p');
          detalle.textContent = modulo.certificado && !modulo.certificado.revocadoEn
            ? 'Tu certificado ya está disponible.'
            : 'La aprobación quedó registrada. El certificado será emitido por la docente.';
          aprobado.appendChild(mensaje);
          aprobado.appendChild(detalle);
          if (modulo.certificado && !modulo.certificado.revocadoEn) aprobado.appendChild(enlaceCertificado(modulo.id));
          contenedor.appendChild(aprobado);
          return;
        }

        var formulario = document.createElement('form');
        formulario.className = 'epja-evaluation-form';
        modulo.autoevaluacion.preguntas.forEach(function (pregunta, indice) {
          var tarjeta = document.createElement('fieldset');
          tarjeta.className = 'epja-question';
          var leyenda = document.createElement('legend');
          leyenda.textContent = (indice + 1) + '. ' + pregunta.enunciado;
          tarjeta.appendChild(leyenda);
          pregunta.opciones.forEach(function (opcion, opcionIndice) {
            var etiqueta = document.createElement('label');
            etiqueta.className = 'epja-answer';
            var radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'pregunta-' + indice;
            radio.value = String(opcionIndice);
            radio.required = true;
            var texto = document.createElement('span');
            texto.textContent = opcion.texto;
            etiqueta.appendChild(radio);
            etiqueta.appendChild(texto);
            tarjeta.appendChild(etiqueta);
          });
          formulario.appendChild(tarjeta);
        });
        var resultado = document.createElement('div');
        resultado.className = 'epja-result';
        resultado.hidden = true;
        formulario.appendChild(resultado);
        var entregar = document.createElement('button');
        entregar.className = 'epja-btn';
        entregar.type = 'submit';
        entregar.textContent = 'Entregar autoevaluación';
        formulario.appendChild(entregar);
        formulario.addEventListener('submit', function (evento) {
          evento.preventDefault();
          if (!formulario.reportValidity()) return;
          var respuestas = modulo.autoevaluacion.preguntas.map(function (pregunta, indice) {
            var elegida = formulario.querySelector('input[name="pregunta-' + indice + '"]:checked');
            return { preguntaId: pregunta.id, opcion: Number(elegida.value) };
          });
          entregar.disabled = true;
          entregar.textContent = 'Corrigiendo…';
          resultado.hidden = true;
          EPJAApi.alumno.responderAutoevaluacion(modulo.id, respuestas).then(function (datos) {
            resultado.hidden = false;
            resultado.className = 'epja-result ' + (datos.aprobado ? 'ok' : 'retry');
            resultado.textContent = '';
            var nota = document.createElement('strong');
            nota.textContent = datos.aciertos + ' de ' + datos.total + ' correctas · ' + datos.porcentaje + '%';
            var mensaje = document.createElement('p');
            mensaje.textContent = datos.mensaje;
            resultado.appendChild(nota);
            resultado.appendChild(mensaje);
            if (datos.certificado) resultado.appendChild(enlaceCertificado(modulo.id));
            if (datos.aprobado) {
              formulario.querySelectorAll('input').forEach(function (input) { input.disabled = true; });
              entregar.remove();
              var estadoModulo = document.getElementById('estado');
              estadoModulo.className = 'epja-pill ok';
              estadoModulo.textContent = 'Aprobado';
            } else {
              entregar.disabled = false;
              entregar.textContent = 'Volver a intentar';
            }
            resultado.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }).catch(function (error) {
            resultado.hidden = false;
            resultado.className = 'epja-result retry';
            resultado.textContent = error.message;
            entregar.disabled = false;
            entregar.textContent = 'Entregar autoevaluación';
          });
        });
        contenedor.appendChild(formulario);
      }

      document.getElementById('contenido').addEventListener('click', function (evento) {
        var enlace = evento.target.closest && evento.target.closest('a[href^="/api/epja/archivos/"]');
        if (!enlace) return;
        evento.preventDefault();
        enlace.classList.add('descargando');
        var adjunto = enlace.closest('.ql-attachment');
        var pedido = adjunto && adjunto._archivoAdjunto
          ? Promise.resolve(adjunto._archivoAdjunto)
          : EPJAApi.alumno.descargarArchivo(enlace.getAttribute('href'));
        pedido.then(function (archivo) {
          var coincidencia = archivo.disposicion.match(/filename\*=UTF-8''([^;]+)/i);
          var nombre = coincidencia ? decodeURIComponent(coincidencia[1]) : enlace.textContent.trim() || 'archivo';
          var url = URL.createObjectURL(archivo.contenido);
          var descarga = document.createElement('a');
          descarga.href = url;
          descarga.download = nombre;
          document.body.appendChild(descarga);
          descarga.click();
          descarga.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }).catch(function (error) {
          if (error.estado === 401) salir();
          else alert(error.message);
        }).finally(function () {
          enlace.classList.remove('descargando');
        });
      });

      window.addEventListener('beforeunload', function () {
        document.querySelectorAll('#contenido .ql-attachment').forEach(function (adjunto) {
          if (adjunto._urlPreview) URL.revokeObjectURL(adjunto._urlPreview);
        });
      });

      Promise.all([EPJAApi.alumno.modulo(id), EPJAApi.alumno.materias()]).then(function (res) {
        var modulo = res[0];
        var materias = res[1];
        EPJAApi.ui.pintarNavMaterias(document.getElementById('epja-nav'), materias, { activaCodigo: modulo.materiaCodigo });
        pintar(modulo);
      }).catch(function (error) {
        if (error.estado === 401) salir();
        else mostrarError(error);
      });
    })();
  </script>
</body>
</html>
